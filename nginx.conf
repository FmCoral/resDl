# ==========================================
# resDl Nginx 站点配置（推荐）
# 将本文件内容复制到宝塔面板「网站→设置→配置文件」中，
# 或直接替换 Nginx server 块的相应部分。
# ==========================================

# 禁止直接访问 uploads 目录（所有文件必须通过 download.php 输出）
location /uploads/ {
    deny all;
    return 403;
}

# 禁止访问 inc 目录（核心代码保护）
location /inc/ {
    deny all;
    return 403;
}

# 禁止 uploads 目录执行 PHP
location ~* /uploads/.*\.(php|phtml|php5|php7|php8)$ {
    deny all;
    return 403;
}

